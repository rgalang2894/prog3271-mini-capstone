<!DOCTYPE html>
<html lang="en">
  <head>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sproutly - Add Plant</title>
  <link rel="stylesheet" href="/user-plants.css" />
</head>

  <body>
    <div class="card">
      <h1>Add a User Plant</h1>
      <p>Use this form to add a plant to your personal collection.</p>

      <form id="user-plant-form">
        <label for="user_id">User ID</label>
        <input id="user_id" name="user_id" type="number" value="1" required />

        <label for="catalog_id">Catalog ID</label>
        <input id="catalog_id" name="catalog_id" type="number" value="1" required />

        <label for="custom_name">Plant Name</label>
        <input id="custom_name" name="custom_name" type="text" placeholder="e.g. Sunny" required />

        <label for="location">Location</label>
        <select id="location" name="location">
          <option value="Living Room">Living Room</option>
          <option value="Balcony">Balcony</option>
          <option value="Kitchen">Kitchen</option>
          <option value="Bedroom">Bedroom</option>
        </select>

        <label for="last_watered">Last Watered</label>
        <input id="last_watered" name="last_watered" type="date" />

        <button type="submit">Save Plant</button>
      </form>

      <div id="message" class="message"></div>
    </div>

    <script>
      const form = document.querySelector("#user-plant-form");
      const messageBox = document.querySelector("#message");
      const userIdInput = document.querySelector("#user_id");
      const catalogIdInput = document.querySelector("#catalog_id");
      const customNameInput = document.querySelector("#custom_name");
      const locationInput = document.querySelector("#location");
      const lastWateredInput = document.querySelector("#last_watered");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const payload = {
          user_id: Number(userIdInput.value),
          catalog_id: Number(catalogIdInput.value),
          custom_name: customNameInput.value,
          location: locationInput.value,
          last_watered: lastWateredInput.value || null,
        };

        messageBox.className = "message";
        messageBox.style.display = "none";

        try {
          const response = await fetch("/user-plants", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });

          const result = await response.json();

          if (!response.ok) {
            throw new Error(result.error || "Unable to save plant");
          }

          messageBox.textContent = `Plant added successfully: ${result.custom_name}`;
          messageBox.className = "message success";
          messageBox.style.display = "block";
          form.reset();
          userIdInput.value = "1";
          catalogIdInput.value = "1";
        } catch (error) {
          messageBox.textContent = error.message;
          messageBox.className = "message error";
          messageBox.style.display = "block";
        }
      });
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/stylesheets/style.css" />
    <title>Sproutly - Create Account</title>
  </head>
  <body>
    <main class="auth-card">
      <div class="plant-icon"></div>
      <h1>Create account</h1>
      <p class="subtitle">Join Sproutly and start tracking your plant care.</p>

      <form id="signup-form" class="auth-form">
        <div class="field">
          <label for="name">Name</label>
          <input id="name" name="name" type="text" placeholder="Your name" required />
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" placeholder="you@example.com" required />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" placeholder="Create password" required />
        </div>

        <button class="signup-btn" type="submit">Create Account</button>
      </form>

      <p id="message"></p>

      <p class="footer-text">
        Already have an account?
        <a href="login.html">Log in</a>
      </p>
    </main>

    <script>
      const signupForm = document.querySelector("#signup-form");
      const message = document.querySelector("#message");

      signupForm.addEventListener("submit", async (event) => {
        event.preventDefault();

        const name = signupForm.querySelector('input[name="name"]').value;
        const email = signupForm.querySelector('input[name="email"]').value;
        const password = signupForm.querySelector('input[name="password"]').value;

        const response = await fetch("/users/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, email, password }),
        });

        const data = await response.json();
        message.textContent = data.message || "Something went wrong.";

        if (response.ok) {
          window.location.href = "/login.html";
        }
      });
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/stylesheets/style.css"/>
    <title>Sproutly</title>
  </head>
  <body>
    <main class="splash-card">
      <div class="splash-plant-icon"></div>
      <h1>Welcome to Sproutly</h1>
      <p class="splash-subtitle">
        Your plant journey starts here.
      </p>

      <div class="button-group">
        <button class="login-btn">Log In</button>
        <button class="splash-signup-btn">Create Account</button>
      </div>

      <p class="footer-text">Start caring for your plants today.</p>
    </main>

    <script>
      const loginBtn = document.querySelector(".login-btn");
      const signupBtn = document.querySelector(".splash-signup-btn");

      loginBtn.addEventListener("click", () => {
        window.location.href = "/login.html";
      });

      signupBtn.addEventListener("click", () => {
        window.location.href = "/signup.html";
      });
    </script>
  </body>
</html>

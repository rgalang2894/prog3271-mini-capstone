<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sproutly - Profile</title>
    <link rel="stylesheet" href="/stylesheets/dashboard.css">
    <link rel="stylesheet" href="./stylesheets/style.css">
    <link rel="stylesheet" href="./stylesheets/profile.css">
</head>
<body>
  <div class="dashboard-layout">
    <aside class="sidebar">
      <div>
        <div class="brand">
          <h1>Sproutly</h1>
          <p>Grow with confidence</p>
        </div>

        <nav>
          <ul class="nav-links">
            <li><a href="/dashboard.html"><span class="icon"></span>Dashboard</a></li>
            <li><a href="/user-plants.html"><span class="icon"></span>My Garden</a></li>
            <li><a href="/reminders.html"><span class="icon"></span>Reminders</a></li>
            <li><a href="/profile.html" class="active"><span class="icon"></span>Profile</a></li>
            <li><a href="/plant-catalog.html"><span class="icon"></span>Plant Catalogue</a></li>
          </ul>
        </nav>
      </div>

      <div class="footer-note">
        <a class="add-plant" href="/add-user-plants.html">
          <span>+</span> Add New Plant
        </a>

        <a class="help-link" href="#">
          <span class="round-icon">?</span> Help
        </a>

       <button class="logout-btn" onclick="logout()">Logout</button>
      </div>
    </aside>

    <main class="profile-main">
      <section class="profile-hero">
        <div class="profile-copy">
          <p class="eyebrow">Account</p>
          <h1>Your Profile</h1>
          <p>Manage your Sproutly account information and keep your profile up to date.</p>
        </div>
      </section>

      <section class="profile-layout">
        <div class="profile-card profile-summary">
          <div class="profile-avatar-wrapper">
            <div class="profile-avatar" id="profileAvatar">
              <span id="avatarInitial">U</span>
              <img id="profileImage" src="" alt="Profile picture" style="display: none;">
            </div>
          </div>

          <h2 id="displayUsername">User</h2>
          <p id="displayEmail">user@example.com</p>

          <label class="photo-upload">
            <input type="file" id="profilePhoto" accept="image/*">
            Choose Photo
          </label>

          <div class="profile-info">
            <div class="profile-info-row">
              <span>Username</span>
              <strong id="summaryUsername">—</strong>
            </div>
            <div class="profile-info-row">
              <span>Email</span>
              <strong id="summaryEmail">—</strong>
            </div>
          </div>
        </div>


      </section>
    </main>
  </div>

  <script>
    const profilePhoto = document.getElementById("profilePhoto");

    const displayUsername = document.getElementById("displayUsername");
    const displayEmail = document.getElementById("displayEmail");
    const summaryUsername = document.getElementById("summaryUsername");
    const summaryEmail = document.getElementById("summaryEmail");
    const avatarInitial = document.getElementById("avatarInitial");
    const profileImage = document.getElementById("profileImage");
    const logout = () => {
      localStorage.removeItem("token");
      localStorage.removeItem("user");
      window.location.href = "/login.html";
    };
    const token = localStorage.getItem("token");
    const rawUser = localStorage.getItem("user");
    const user = rawUser ? JSON.parse(rawUser) : null;

    if (!token || !user) {
      window.location.href = "/login.html";
    } else {
      const name = user.name || "User";
      const email = user.email || "user@example.com";

      displayUsername.textContent = name;
      displayEmail.textContent = email;
      summaryUsername.textContent = name;
      summaryEmail.textContent = email;
      avatarInitial.textContent = name.trim().charAt(0).toUpperCase();
      profileImage.style.display = "none";
    }

    profilePhoto.addEventListener("change", function () {
      const file = this.files[0];
      if (!file) return;
      const image = document.getElementById("profileImage");
      const initial = document.getElementById("avatarInitial");
      image.src = URL.createObjectURL(file);
      image.style.display = "block";
      initial.style.display = "none";
    });
  </script>
</body>
</html>
